name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dospa_owner
          POSTGRES_PASSWORD: ci_owner_password
          POSTGRES_DB: dospa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dospa_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      APP_URL: http://localhost:3100
      DATABASE_OWNER_URL: postgresql://dospa_owner:ci_owner_password@localhost:5432/dospa
      DATABASE_URL: postgresql://dospa_app:ci_app_password@localhost:5432/dospa
      APP_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      MAIL_TRANSPORT: log
      SEED_DEMO_PASSWORD: ci-demo-password-not-secret
      SEED_DEMO_TOTP_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: psql postgresql://dospa_owner:ci_owner_password@localhost:5432/dospa -c "CREATE DATABASE dospa_test"
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @dospa/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
